name: Monitoramento de Mercado Multirregional

on:
  schedule:
    # Execução diária regular às 06:00 UTC (03:00 Horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      inicio_mmaaaa:
        description: 'Mês/Ano Inicial (MMAAAA - ex: 102021). Deixe vazio para diário.'
        required: false
        default: ''
      fim_mmaaaa:
        description: 'Mês/Ano Final (MMAAAA - ex: 092026). Deixe vazio para diário.'
        required: false
        default: ''

env:
  TZ: "America/Sao_Paulo"

jobs: 
  executar-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - latam_fintechs
          - latam_plataformas
          - latam_tendencias
          - anglo_fintechs
          - anglo_plataformas
          - anglo_tendencias
          - europa
          - asia_cn_sg
          - asia_jp_kr
          - mea_india

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Liberar espaco em disco no Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias e Navegador Headless
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
          sudo apt-get update && sudo apt-get install -y rclone

      - name: Configurar Rclone para Drive (Config e Dados Brutos)
        env:
          GDRIVE_SA_KEY_B64: ${{ secrets.GDRIVE_SA_KEY }}
          ID_CONFIGS: ${{ secrets.GDRIVE_CONFIG_FOLDER_ID }}
          ID_DADOS_BRUTOS: ${{ secrets.GDRIVE_DADOS_BRUTOS_FOLDER_ID }}
        run: |
          echo "$GDRIVE_SA_KEY_B64" | base64 -d > /tmp/gdrive_sa.json
          python -c 'import json; json.load(open("/tmp/gdrive_sa.json"))'

          CLEAN_CONFIGS=$(echo "$ID_CONFIGS" | grep -oE '[a-zA-Z0-9_-]{25,}' | head -n 1)
          if [ -z "$CLEAN_CONFIGS" ]; then CLEAN_CONFIGS="$ID_CONFIGS"; fi

          CLEAN_DADOS=$(echo "$ID_DADOS_BRUTOS" | grep -oE '[a-zA-Z0-9_-]{25,}' | head -n 1)
          if [ -z "$CLEAN_DADOS" ]; then CLEAN_DADOS="$ID_DADOS_BRUTOS"; fi

          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive_config]
          type = drive
          scope = drive
          service_account_file = /tmp/gdrive_sa.json
          root_folder_id = $CLEAN_CONFIGS
          include_shared_with_me = true

          [gdrive_dados]
          type = drive
          scope = drive
          service_account_file = /tmp/gdrive_sa.json
          root_folder_id = $CLEAN_DADOS
          include_shared_with_me = true
          EOF

      - name: Executar Pipeline do Shard [${{ matrix.shard }}]
        env:
          PYTHONUNBUFFERED: "1"
          SHARD_NAME: ${{ matrix.shard }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PARAMS="--shard ${{ matrix.shard }}"
          if [ -n "${{ inputs.inicio_mmaaaa }}" ] && [ -n "${{ inputs.fim_mmaaaa }}" ]; then
            PARAMS="$PARAMS --inicio_mmaaaa ${{ inputs.inicio_mmaaaa }} --fim_mmaaaa ${{ inputs.fim_mmaaaa }}"
          fi
          python main.py $PARAMS

      - name: Sincronizacao de Contingencia para o Drive
        if: always()
        run: |
          for f in noticias_${{ matrix.shard }}_*.json; do
            if [ -f "$f" ]; then
              rclone copyto "$f" "gdrive_dados:$(basename "$f")"
            fi
          done

      - name: Preservar JSON em Artifacts do GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noticias-${{ matrix.shard }}
          path: noticias_${{ matrix.shard }}_*.json
          retention-days: 14

      - name: Expurgo de Credenciais Temporarias
        if: always()
        run: |
          rm -rf /tmp/gdrive_sa.json ~/.config/rclone/rclone.conf
