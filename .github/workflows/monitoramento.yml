name: Monitoramento de Mercado Multirregional

on:
  schedule:
    # Executa todos os dias às 06:00 UTC (03:00 Horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  TZ: "America/Sao_Paulo"

jobs: 
  executar-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard:
          - latam_fintechs
          - latam_plataformas
          - latam_tendencias
          - anglo_fintechs
          - anglo_plataformas
          - anglo_tendencias
          - europa
          - asia_cn_sg
          - asia_jp_kr
          - mea_india

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Liberar espaco em disco no Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias e Navegador Headless
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
          sudo apt-get update && sudo apt-get install -y rclone

      - name: Configurar Rclone em Memoria para Acesso ao Drive
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          ID_CONFIGS: ${{ secrets.GDRIVE_CONFIG_FOLDER_ID }}
        run: |
          echo "$GDRIVE_SA_KEY" > /tmp/gdrive_sa.json
          CLEAN_CONFIGS=$(echo "$ID_CONFIGS" | grep -oE '[a-zA-Z0-9_-]{25,}' | head -n 1)
          if [ -z "$CLEAN_CONFIGS" ]; then CLEAN_CONFIGS="$ID_CONFIGS"; fi

          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive_config]
          type = drive
          scope = drive
          service_account_file = /tmp/gdrive_sa.json
          root_folder_id = $CLEAN_CONFIGS
          include_shared_with_me = true
          EOF

      - name: Executar Pipeline do Shard [${{ matrix.shard }}]
        env:
          PYTHONUNBUFFERED: "1"
          SHARD_NAME: ${{ matrix.shard }}
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
        run: python main.py --shard ${{ matrix.shard }}
        
      - name: Preservar JSON em Artifacts do GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noticias-${{ matrix.shard }}
          path: noticias_${{ matrix.shard }}_*.json
          retention-days: 14

      - name: Expurgo de Credenciais Temporarias
        if: always()
        run: |
          rm -rf /tmp/gdrive_sa.json ~/.config/rclone/rclone.conf

      - name: Notificar falha via Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHARD_NAME: ${{ matrix.shard }}
        run: |
          python -c '
          import os, requests
          token = os.getenv("TELEGRAM_BOT_TOKEN")
          shard = os.getenv("SHARD_NAME")
          ids = [i.strip() for i in os.getenv("TELEGRAM_CHAT_ID", "").split(",") if i.strip()]
          msg = f"🚨 <b>FALHA NO SHARD {shard.upper()}</b>\nA rotina diária encontrou um erro operacional."
          for chat_id in ids:
              try:
                  requests.post(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      data={"chat_id": chat_id, "text": msg, "parse_mode": "HTML"},
                      timeout=30
                  )
              except Exception:
                  pass
          '
