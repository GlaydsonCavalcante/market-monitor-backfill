name: Monitoramento de Mercado Multirregional

on:
  schedule:
    # Executa todos os dias às 06:00 UTC (03:00 Horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  executar-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # Garante que a falha de um shard NÃO cancela os demais
      matrix:
        # Lista com todos os novos configs criados
        shard:
          - latam_fintechs
          - latam_plataformas
          - latam_tendencias
          - anglo_fintechs
          - anglo_plataformas
          - anglo_tendencias
          - europa
          - asia_cn_sg
          - asia_jp_kr
          - mea_india

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      # Mantido: previne estouro de armazenamento no ambiente do runner
      - name: Liberar espaco em disco no Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Mantido/Comentado: pronto para reativação caso volte a vetorizar com BGE-M3 no GitHub
      # - name: Cache do Modelo BGE-M3
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.cache/huggingface
      #     key: ${{ runner.os }}-hf-bge-m3

      - name: Instalar dependencias (PyTorch CPU)
        run: pip install -r requirements.txt

      - name: Executar Pipeline do Shard [${{ matrix.shard }}]
        env:
          PYTHONUNBUFFERED: "1"
          SHARD_NAME: ${{ matrix.shard }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "405898240,5401165820,8998554084"
        run: python main.py --config config_${{ matrix.shard }}.py

      - name: Notificar falha via Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "405898240,5401165820,8998554084"
          SHARD_NAME: ${{ matrix.shard }}
        run: |
          python -c '
          import os, requests
          token = os.getenv("TELEGRAM_BOT_TOKEN")
          shard = os.getenv("SHARD_NAME")
          ids = [i.strip() for i in os.getenv("TELEGRAM_CHAT_ID", "").split(",") if i.strip()]
          msg = f"🚨 <b>FALHA NO SHARD {shard.upper()}</b>\nA rotina encontrou um erro crítico. Os demais shards continuam em execução."
          for chat_id in ids:
              try:
                  requests.post(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      data={"chat_id": chat_id, "text": msg, "parse_mode": "HTML"},
                      timeout=30
                  )
              except Exception:
                  pass
          '
