name: Pipeline de Monitoramento de Mercado

on:
  schedule:
    # Execução diária às 03:00 UTC (03:00 Horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite disparo manual pelo painel de controle

jobs:
  executar-monitoramento:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar bibliotecas
        run: pip install -r requirements.txt

      - name: Executar rotina de extracao
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: 405898240,5401165820
        run: python main.py
